# Nginx do container web — serve o app React e faz proxy do backend (serviço "api")
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend (API) — o host "api" é o nome do serviço no docker-compose
    location /api {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_header Authorization;
        client_max_body_size 10M;
    }

    location /auth {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads { proxy_pass http://api:3001; }
    location /health  { proxy_pass http://api:3001; }

    # SPA fallback — todas as rotas do React caem aqui
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
